name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Floorp version (e.g. 11.26.0)"
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Ant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $antVersion = '1.10.18'
          $antArchive = Join-Path $env:RUNNER_TEMP "apache-ant-$antVersion-bin.zip"
          $antDirectory = Join-Path $env:RUNNER_TEMP "apache-ant-$antVersion"
          $expectedHash = 'f86d7b263bc7c6903a91532943f1c8ecccc17dd999851a796617e79795908d7a666cbe999b9ecf06735cc7e830f50dca9f49b37bb5f6f02a0a3803cd22b558b0'
          Invoke-WebRequest -Uri "https://archive.apache.org/dist/ant/binaries/apache-ant-$antVersion-bin.zip" -OutFile $antArchive
          if ((Get-FileHash -LiteralPath $antArchive -Algorithm SHA512).Hash -ne $expectedHash) {
            throw 'Apache Ant archive SHA-512 mismatch'
          }
          Expand-Archive -LiteralPath $antArchive -DestinationPath $env:RUNNER_TEMP
          "ANT_HOME=$antDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $antDirectory 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Check environment
        run: |
          go version
          java -version
          ant -version
          node --version

      - name: Set environment variables
        run: |
          $FLOORP_VERSION = '${{ inputs.version }}'
          if (-not $FLOORP_VERSION) {
            Write-Host "Version input is required. Please use workflow_dispatch to trigger this workflow."
            exit 1
          }
          echo "FLOORP_VERSION=$FLOORP_VERSION" >> $env:GITHUB_ENV
          echo "Using Floorp version: $FLOORP_VERSION"

      - name: Update build.properties
        run: |
          $content = Get-Content build.properties
          $content = $content -replace 'app.version = .+', "app.version = $env:FLOORP_VERSION"
          $content | Set-Content build.properties
          cat build.properties

      - name: Prepare build
        run: |
          # Install required Go tools
          go install -v github.com/kevinburke/go-bindata/v4/go-bindata
          go install -v github.com/josephspurrier/goversioninfo/cmd/goversioninfo

          # Make sure resources are ready
          if (-not (Test-Path "assets")) {
            New-Item -Path "assets" -ItemType Directory -Force
          }

          if (Test-Path "res\Floorp.lnk") {
            go-bindata -prefix res/ -pkg assets -o assets/assets.go res/Floorp.lnk
          } else {
            Copy-Item -Path "res\Firefox.lnk" -Destination "res\Floorp.lnk" -Force
            go-bindata -prefix res/ -pkg assets -o assets/assets.go res/Floorp.lnk
          }

          # Generate version info
          goversioninfo

      - name: Clone portapps core
        run: |
          cd ../
          git clone https://github.com/Floorp-Projects/portapps.git portapps

      - name: Patch portapps core for Java 17+ compatibility
        run: |
          # Replace JavaScript scriptdef (Nashorn) with pure Ant macrodef
          $buildCommon = "../portapps/.build/build-common.xml"
          $content = Get-Content $buildCommon -Raw
          $pattern = '(?s)(\s*<!-- Functions -->\s*)<scriptdef name="randomstring" language="javascript">.*?</scriptdef>'
          $replacement = '$1<macrodef name="randomstring"><attribute name="property"/><sequential><local name="rs.rand"/><tstamp><format property="rs.rand" pattern="yyyyMMddHHmmssSS"/></tstamp><var name="@{property}" value="$${rs.rand}"/></sequential></macrodef>'
          $content = $content -replace $pattern, $replacement
          Set-Content $buildCommon $content
          Write-Host "Patched build-common.xml to remove Nashorn dependency"

      - name: Build portable app
        run: |
          ant release

      - name: List built artifacts
        run: |
          ls bin/release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          latest: true
          tag_name: v${{ env.FLOORP_VERSION }}
          files: |
            bin/release/*.7z
            bin/release/*.txt
          name: Floorp Portable ${{ env.FLOORP_VERSION }}
          body: |
            # Floorp Portable ${{ env.FLOORP_VERSION }}

            Portable version of Floorp browser that can be run from any location without installation.

            ## Usage
            1. Extract the archive to any location (e.g., USB drive)
            2. Run `floorp-portable-win64.exe`

            ## Notes
            - Your profile and settings are stored in the same directory
            - The application won't leave traces on the host computer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
